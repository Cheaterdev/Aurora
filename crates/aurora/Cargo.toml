[package]
name = "aurora"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
aurora-store = { version = "0.1.0", path = "../aurora-store" }
axum = "0.8.9"
futures-util = { version = "0.3", default-features = false }
maud = "0.27"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tower-http = { version = "0.7.1", default-features = false, features = ["catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
sha2 = "0.10.9"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util"] }

[target."cfg(windows)".dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_Foundation"] }
